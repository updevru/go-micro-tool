name: Docker Build and Publish

on:
  push:
    branches:
      - main
    paths:
      - '1.24/**'
      - '1.25/**'
      - '1.27.4/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches:
      - main
    paths:
      - '1.27.4/**'
      - '.github/workflows/docker-publish.yml'

jobs:
  check-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build CI image without publishing
        run: docker build --tag go-micro-tool:pr ./1.27.4

      - name: Check toolchain
        run: |
          docker run --rm go-micro-tool:pr sh -ec '
            go version
            test "$(go env GOVERSION)" = go1.27.4
            golangci-lint version | grep -F "version 2.15.0 "
            gotestsum --version
            protoc --version
            for tool in protoc-gen-grpc-gateway protoc-gen-openapiv2 protoc-gen-go \
              protoc-gen-go-grpc protoc-gen-protolint; do
              executable=$(command -v "$tool")
              go version -m "$executable" | sed -n "1p; /[[:space:]]mod[[:space:]]/p"
            done
            command -v gcc
            cd "$(mktemp -d)"
            go mod init example.com/toolchain-check
            printf "package toolchaincheck\n\nimport \"net/http\"\n\nconst Method = http.MethodGet\n" > toolchain.go
            golangci-lint run
          '

  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            1.24:
              - '1.24/**'
            1.25:
              - '1.25/**'
            1.27.4:
              - '1.27.4/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJSON(needs.detect-changes.outputs.versions) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.version }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-micro-tool:${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}
